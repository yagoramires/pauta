# App do Slack do Pauta: só lê (user token), sem bot. Crie em api.slack.com/apps -> From a manifest.
display_information:
  name: Pauta
oauth_config:
  scopes:
    user:
      - im:read
      - im:history
      - mpim:read
      - mpim:history
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read
      - search:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
